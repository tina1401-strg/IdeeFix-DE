[project]
name = "ideefixde-encoder"
version = "0.1.0"
description = "Simplified unofficial PyTorch implementation of 'GECToR -- Grammatical Error Correction: Tag, Not Rewrite'"
readme = "README.md"
requires-python = ">=3.11.0"
dependencies = [
    "torch==2.4.0+cu121",
    "transformers==4.49.0",
    "tokenizers==0.21.0",
    "accelerate>=1.3.0",
    "huggingface-hub>=0.28.1",
    "numpy",
    "tqdm",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
